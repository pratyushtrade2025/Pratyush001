name: Daily Stock Screener

on:
  schedule:
    # Runs at 10:00 UTC (15:30 IST) Monday to Friday
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Allows you to run it manually anytime from GitHub

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance openpyxl pytz schedule

      - name: Execute Screener Bot
        run: python screener_bot.py
